<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrera circular</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141a24;
      --muted: #aeb8c8;
      --white: #f4f7fb;
      --red: #ff4655;
      --cyan: #42d9f5;
      --track: #353c48;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--white);
      background:
        radial-gradient(ellipse at 50% 45%, #1a2331 0%, var(--bg) 72%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .scene {
      width: min(1100px, 100%);
      border: 1px solid #303948;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(145deg, #111722, #0b0f16 75%);
      box-shadow: 0 24px 80px #0008;
    }

    .eyebrow {
      color: #8f9db2;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: -.035em;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #e9eef7;
      background: #242d3a;
      border: 1px solid #3a4658;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: .82rem;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4655;
      box-shadow: 0 0 12px #ff4655;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
      }
    }

    .track-wrap {
      padding: 4px 16px 0;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .track-shadow {
      fill: none;
      stroke: #05070b;
      stroke-width: 104;
      stroke-linecap: round;
    }

    .track-base {
      fill: none;
      stroke: var(--track);
      stroke-width: 92;
      stroke-linecap: round;
    }

    .track-edge {
      fill: none;
      stroke: #707b8b;
      stroke-width: 2.5;
      opacity: .8;
    }

    .track-center {
      fill: none;
      stroke: #d9e0e9;
      stroke-width: 2;
      stroke-dasharray: 12 13;
      opacity: .48;
    }

    .start-line {
      stroke: white;
      stroke-width: 7;
    }

    .start-line-shadow {
      stroke: #05070b;
      stroke-width: 15;
    }

    .start-label {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .12em;
      fill: #fff;
    }

    .small-label {
      font-size: 13px;
      font-weight: 700;
      fill: #b9c4d4;
      letter-spacing: .06em;
    }

    .infield {
      fill: #101a20;
      stroke: #253a3e;
      stroke-width: 2;
    }

    .infield-line {
      fill: none;
      stroke: #20383b;
      stroke-width: 1.5;
      stroke-dasharray: 5 8;
    }

    .car-body {
      stroke: #080b10;
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .car-number {
      font: 900 12px system-ui, sans-serif;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 28px;
      padding: 8px 20px 18px;
      color: var(--muted);
      font-size: .9rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .swatch {
      width: 24px;
      height: 7px;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .track-wrap {
        padding: 0 4px;
      }

      .legend {
        gap: 10px 16px;
        font-size: .8rem;
      }

      .footer {
        padding: 12px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }

      animateMotion {}
    }
  </style>
</head>

<body>
  <main class="scene">

    <div class="track-wrap">
      <svg viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
        <title id="title">Dos autos compitiendo en una pista cerrada</title>
        <desc id="desc">Dos autos recorren una pista ovalada y pasan repetidamente por la misma línea de salida y
          llegada.</desc>
        <defs>
          <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1b2431" stroke-width="1" />
          </pattern>
          <g id="carRed">
            <ellipse cx="0" cy="5" rx="25" ry="12" fill="#0008" />
            <rect x="-22" y="-10" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="10" y="-10" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="-22" y="5" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="10" y="5" width="12" height="7" rx="2" fill="#11151c" />
            <path class="car-body"
              d="M-27 0 L-18 -5 L-9 -5 L-4 -11 L10 -11 L17 -5 L25 -3 L29 0 L25 4 L15 5 L-17 5 L-26 3 Z"
              fill="#ff4655" />
            <path d="M-8 -7 L8 -7 L13 -3 L-12 -3 Z" fill="#17212e" />
            <path d="M-28 -2 L-19 -2 L-19 2 L-28 2 Z" fill="#ffd4d7" />
            <path d="M20 -2 L29 -2 L29 2 L20 2 Z" fill="#ffd4d7" />
            <circle cx="0" cy="0" r="5.5" fill="#f6f8fb" />
            <text class="car-number" x="0" y="0.5">1</text>
          </g>
          <g id="carBlue">
            <ellipse cx="0" cy="5" rx="25" ry="12" fill="#0008" />
            <rect x="-22" y="-10" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="10" y="-10" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="-22" y="5" width="12" height="7" rx="2" fill="#11151c" />
            <rect x="10" y="5" width="12" height="7" rx="2" fill="#11151c" />
            <path class="car-body"
              d="M-27 0 L-18 -5 L-9 -5 L-4 -11 L10 -11 L17 -5 L25 -3 L29 0 L25 4 L15 5 L-17 5 L-26 3 Z"
              fill="#42d9f5" />
            <path d="M-8 -7 L8 -7 L13 -3 L-12 -3 Z" fill="#17212e" />
            <path d="M-28 -2 L-19 -2 L-19 2 L-28 2 Z" fill="#e3fbff" />
            <path d="M20 -2 L29 -2 L29 2 L20 2 Z" fill="#e3fbff" />
            <circle cx="0" cy="0" r="5.5" fill="#f6f8fb" />
            <text class="car-number" x="0" y="0.5">2</text>
          </g>
        </defs>

        <rect x="0" y="0" width="1000" height="570" rx="16" fill="url(#grid)" />
        <!-- Pista cerrada: la salida y la llegada comparten exactamente el mismo punto -->
        <path class="track-shadow" d="M 285 105 H 715 A 180 180 0 0 1 715 465 H 285 A 180 180 0 0 1 285 105 Z"
          transform="translate(0 0)" />
        <path class="track-base" d="M 285 105 H 715 A 180 180 0 0 1 715 465 H 285 A 180 180 0 0 1 285 105 Z" />
        <path class="track-edge" d="M 285 59 H 715 A 226 226 0 0 1 715 511 H 285 A 226 226 0 0 1 285 59 Z" />
        <path class="track-edge" d="M 285 151 H 715 A 134 134 0 0 1 715 419 H 285 A 134 134 0 0 1 285 151 Z" />
        <path class="track-center" id="racePath"
          d="M 285 105 H 715 A 180 180 0 0 1 715 465 H 285 A 180 180 0 0 1 285 105 Z" />

        <!-- Línea única de salida/llegada -->
        <g transform="translate(285 105)">
          <line class="start-line-shadow" x1="0" y1="-47" x2="0" y2="47" />
          <line class="start-line" x1="0" y1="-47" x2="0" y2="47" />
          <g stroke="#141a24" stroke-width="1.5">
            <path d="M-5 -47 H5 M-5 -35 H5 M-5 -23 H5 M-5 -11 H5 M-5 1 H5 M-5 13 H5 M-5 25 H5 M-5 37 H5" />
          </g>
        </g>
        <path d="M 252 48 L 276 82" stroke="#fff" stroke-width="1.5" opacity=".8" />
        <rect x="135" y="20" width="142" height="35" rx="8" fill="#f4f7fb" />
        <text x="206" y="42" text-anchor="middle" font-size="12" font-weight="900" letter-spacing="1.2"
          fill="#10151e">SALIDA Y LLEGADA</text>

        <!-- Los dos autos recorren la misma trayectoria, con una separación temporal -->
        <g>
          <g>
            <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
              <mpath href="#racePath" />
            </animateMotion>
            <use href="#carRed" />
          </g>
          <g>
            <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" rotate="auto">
              <mpath href="#racePath" />
            </animateMotion>
            <use href="#carBlue" />
          </g>
        </g>
      </svg>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="swatch" style="background:var(--red)"></span> Auto 1</div>
      <div class="legend-item"><span class="swatch" style="background:var(--cyan)"></span> Auto 2</div>
      <div class="legend-item"><span
          style="display:inline-block;width:18px;height:18px;border:3px solid white;border-radius:2px"></span> Salida y
        llegada</div>
  </main>
</body>

</html>
